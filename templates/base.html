{% load static %}
<!DOCTYPE html>
<html lang="en" class="no-js scroll-smooth">
<head>
  <script>document.documentElement.classList.remove("no-js");</script>
  <meta charset="utf-8">
  <title>{% block title %}PythonPH{% endblock %}</title>
  <meta name="description" content="{% block description %}A community in the Philippines for enthusiasts and users of the Python programming language.{% endblock %}">
  <meta name="author" content="PythonPH">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="{% static 'landing/assets/img/icon/icon-logo.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  {% block extra_css %}{% endblock %}
  {% block extra_head %}{% endblock %}
</head>
<body class="flex min-h-screen flex-col bg-white font-sans text-blue leading-normal">
  {% include "includes/navbar.html" %}
  {% block content %}{% endblock %}
  {% include "includes/footer.html" %}
  {% block js %}{% endblock %}
  <script>
    (function () {
      var toggle = document.getElementById("nav-toggle");
      var menu = document.getElementById("nav-menu");
      var iconOpen = document.getElementById("nav-icon-open");
      var iconClose = document.getElementById("nav-icon-close");
      if (toggle && menu) {
        toggle.addEventListener("click", function () {
          var open = menu.classList.toggle("hidden") === false;
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
          if (iconOpen && iconClose) {
            iconOpen.classList.toggle("hidden", open);
            iconClose.classList.toggle("hidden", !open);
          }
        });
        // Close the mobile menu after following an in-page anchor.
        menu.querySelectorAll("a").forEach(function (link) {
          link.addEventListener("click", function () {
            menu.classList.add("hidden");
            toggle.setAttribute("aria-expanded", "false");
            if (iconOpen && iconClose) {
              iconOpen.classList.remove("hidden");
              iconClose.classList.add("hidden");
            }
          });
        });
      }

      // Solid navbar once the page is scrolled.
      var nav = document.getElementById("site-nav");
      if (nav) {
        var onScroll = function () {
          nav.classList.toggle("nav-scrolled", window.scrollY > 8);
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
      }

      // Hero images entrance animations
      var initHeroAnimations = function () {
        var heroContainer = document.querySelector('.hero-images-container');
        if (!heroContainer) return;

        // Trigger entrance animations on page load
        setTimeout(function () {
          heroContainer.classList.add('hero-container-animated');
        }, 100);
      };

      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initHeroAnimations);
      } else {
        initHeroAnimations();
      }
    })();
  </script>
</body>
</html>
