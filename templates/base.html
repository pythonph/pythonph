{% load static %}
<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <script>document.documentElement.classList.remove("no-js");</script>
  <meta charset="utf-8">
  <title>{% block title %}Python.PH{% endblock %}</title>
  <meta name="description" content="{% block description %}A community in the Philippines for enthusiasts and users of the Python programming language.{% endblock %}">
  <meta name="author" content="Python.PH">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="{% static 'landing/assets/img/icon/icon-logo.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  {% block extra_css %}{% endblock %}
</head>
<body class="bg-white font-sans text-blue leading-normal">
  {% include "includes/navbar.html" %}
  {% block content %}{% endblock %}
  {% include "includes/footer.html" %}
  {% block js %}{% endblock %}
  <script>
    (function () {
      var toggle = document.getElementById("nav-toggle");
      var menu = document.getElementById("nav-menu");
      if (toggle && menu) {
        toggle.addEventListener("click", function () {
          menu.classList.toggle("hidden");
        });
      }
    })();
  </script>
</body>
</html>
