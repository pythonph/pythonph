{% load static %}
<style>
.max-w-125 {
  max-width: calc(125px - 8px);
}

.max-w-78 {
  max-width: calc(78px - 8px);
}

</style>

<header class="relative overflow-hidden bg-blue bg-hero-glow">
  <!-- Decorative grid + floating orbs (palette-only) -->
  <div class="absolute inset-0 bg-hero-grid" aria-hidden="true"></div>
  <div class="absolute -left-24 top-1/4 h-64 w-64 rounded-full bg-blue-1/15 blur-3xl animate-pulse-glow" aria-hidden="true"></div>
  <div class="absolute -right-16 bottom-1/4 h-72 w-72 rounded-full bg-yellow/10 blur-3xl animate-pulse-glow" aria-hidden="true"></div>
  <div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-b from-transparent to-blue" aria-hidden="true"></div>

  <div class="relative mx-auto flex min-h-[calc(100vh-4rem)] max-w-6xl flex-col justify-between items-center gap-14 px-4 pb-24 pt-16 lg:flex-row lg:gap-8 lg:pb-28 lg:pt-20">
    <!-- Copy -->
    <div class="max-w-xl text-center lg:text-left">
      <span class="inline-flex items-center gap-2 rounded-full border border-yellow/30 bg-yellow/10 px-4 py-1.5 font-montserrat text-xs font-semibold uppercase tracking-widest text-yellow"
            data-aos="fade-left">
        <span class="h-1.5 w-1.5 rounded-full bg-yellow"></span>
        The home of Pythonistas in the Philippines
      </span>
      <h1 class="mt-6 font-montserrat text-4xl font-semibold leading-[1.08] tracking-tight text-white sm:text-5xl lg:text-6xl"
          data-aos="py-slide" data-aos-delay="100">
        Welcome to<br>
        <span class="text-white">Python</span>
        <span class="bg-gradient-to-r from-yellow to-yellow-1 bg-clip-text text-transparent">Philippines</span>
      </h1>
      <div class="markdown-content-dark mt-6 text-lg leading-relaxed text-white/75"
           data-aos="py-slide" data-aos-delay="200">
        {{ header_intro.content|safe }}
      </div>
      <div class="mt-9 flex flex-col items-center gap-4 sm:flex-row sm:justify-center lg:justify-start"
           data-aos="py-slide" data-aos-delay="300">
        <a href="{% url 'events:events' %}"
           class="btn btn-primary btn-lg rounded-full border-none px-8 font-montserrat font-semibold shadow-[0_8px_30px_-6px_rgba(253,214,73,0.45)] transition-transform hover:-translate-y-0.5">
          Explore Events
        </a>
        <a href="#resources"
           class="btn btn-lg rounded-full border-white/25 bg-transparent px-8 font-montserrat font-semibold text-white transition-all hover:-translate-y-0.5 hover:border-yellow hover:text-yellow">
          Learn Python
        </a>
      </div>
    </div>

<!-- Illustration: Images -->
  <div class="relative flex flex-col items-center w-full max-w-md flex-shrink-0 lg:max-w-lg gap-2 images-wrapper hero-images-container" aria-hidden="true">
    <div class="hidden lg:flex lg:flex-row gap-2 img-container-one w-full justify-center lg:justify-end">
      <img src="{% static 'img/hero_col-1_img-1.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-125 rounded-lg" />
      <img src="{% static 'img/hero_col-1_img-2.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-125 rounded-lg" />
      <img src="{% static 'img/hero_col-1_img-3.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-125 rounded-lg" />
    </div>
    <div class="flex flex-row gap-2 img-container-two w-full justify-center md:justify-center lg:justify-end">
      <img src="{% static 'img/hero_col-2_img-1.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-125  rounded-lg" />
      <img src="{% static 'img/hero_col-2_img-2.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-125 rounded-lg" />
      <img src="{% static 'img/hero_col-2_img-3.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-125 rounded-lg" />
      <img src="{% static 'img/hero_col-2_img-4.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-125 rounded-lg" />
    </div>
    <div class="flex flex-row items-end img-container-three w-full justify-center md:justify-center lg:justify-end">
      <img src="{% static 'img/hero_main-img.jpg' %}" alt="PythonPH Hero Image" class="w-full rounded-lg" />
    </div>
    <div class="flex flex-row gap-2 img-container-four w-full justify-center md:justify-center lg:justify-end">
      <img src="{% static 'img/hero_col-3_img-1.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-125 rounded-lg" />
      <img src="{% static 'img/hero_col-3_img-2.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-125 rounded-lg" />
      <img src="{% static 'img/hero_col-3_img-3.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-125 rounded-lg" />
      <img src="{% static 'img/hero_col-3_img-4.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-125 rounded-lg" />
    </div>
    <div class="hidden lg:flex lg:flex-row gap-2 img-container-five w-full justify-center lg:justify-end">
      <img src="{% static 'img/hero_col-4_img-1.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-78 rounded-lg" />
      <img src="{% static 'img/hero_col-4_img-2.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-78 rounded-lg" />
      <img src="{% static 'img/hero_col-4_img-3.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-78 rounded-lg" />
      <img src="{% static 'img/hero_col-4_img-4.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-78 rounded-lg" />
      <img src="{% static 'img/hero_col-4_img-5.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-78 rounded-lg" />
      <img src="{% static 'img/hero_col-4_img-6.jpg' %}" alt="PythonPH Hero Image" class="w-full max-w-78 rounded-lg" />
    </div>
  </div>
  </div>

  <!-- Scroll hint -->
  <a href="#about" class="absolute bottom-6 left-1/2 hidden -translate-x-1/2 text-white/40 transition-colors hover:text-yellow lg:block" aria-label="Scroll to content">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </a>
</header>
