<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a122b"/>
      <stop offset="0.55" stop-color="#101c42"/>
      <stop offset="1" stop-color="#273460"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#fdd649" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fdd649" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdde50"/>
      <stop offset="1" stop-color="#fdd649"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Decorative rings -->
  <circle cx="1280" cy="180" r="230" fill="none" stroke="#fdd649" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="1280" cy="180" r="150" fill="none" stroke="#fdd649" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1280" cy="180" r="70" fill="none" stroke="#fdd649" stroke-opacity="0.5" stroke-width="2"/>

  <circle cx="300" cy="760" r="200" fill="none" stroke="#6f83c9" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="300" cy="760" r="120" fill="none" stroke="#6f83c9" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Python style brackets motif -->
  <g stroke="#fdd649" stroke-opacity="0.55" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 156 330 h 130 l 46 70 l -46 70 h -130"/>
    <path d="M 216 330 h -46 l -46 70 l 46 70 h 46"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="120" y="420" font-size="96" font-weight="800" fill="url(#accent)">PythonPH</text>
    <text x="124" y="490" font-size="36" font-weight="400" fill="#a2b0e0" letter-spacing="7">COMMUNITY · JOBS · EVENTS</text>
  </g>
</svg>
